name: Windows build and operation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BrainiacDesk.slnx
      - run: dotnet build BrainiacDesk.slnx -c Release --no-restore
      - run: dotnet run --project tests/BrainiacDesk.Tests -c Release
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release -- --teleprompter-tests
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release -- --edge-tests
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release -- --design-tests
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release -- --navigation-tests
      - run: dotnet run --project tests/BrainiacDesk.WindowsTests -c Release -- --fresh-install-tests
      - run: dotnet publish src/BrainiacDesk.App -c Release -r win-x64 --self-contained true -o artifacts/portable
      - uses: actions/upload-artifact@v4
        with:
          name: BrainiacDesk-development-win-x64
          path: artifacts/portable/
